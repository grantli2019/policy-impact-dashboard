<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 策查查 Duotone 图标系统 — 主色: currentColor, 辅色: opacity 0.4 -->

  <!-- 首页 -->
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none">
    <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 9.5V19a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="9" y="14" width="6" height="6" rx="0.5" fill="currentColor" opacity="0.15"/>
  </symbol>

  <!-- 探索/搜索 -->
  <symbol id="icon-explore" viewBox="0 0 24 24" fill="none">
    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="3" fill="currentColor" opacity="0.15"/>
    <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 工具/计算器 -->
  <symbol id="icon-tools" viewBox="0 0 24 24" fill="none">
    <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
    <rect x="7" y="6" width="10" height="4" rx="1" fill="currentColor" opacity="0.15"/>
    <circle cx="8.5" cy="14" r="1" fill="currentColor"/>
    <circle cx="12" cy="14" r="1" fill="currentColor"/>
    <circle cx="15.5" cy="14" r="1" fill="currentColor"/>
    <circle cx="8.5" cy="17.5" r="1" fill="currentColor"/>
    <circle cx="12" cy="17.5" r="1" fill="currentColor"/>
    <circle cx="15.5" cy="17.5" r="1" fill="currentColor" opacity="0.4"/>
  </symbol>

  <!-- 我的/用户 -->
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="12" cy="8" r="2" fill="currentColor" opacity="0.15"/>
    <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 监控/铃铛 -->
  <symbol id="icon-bell" viewBox="0 0 24 24" fill="none">
    <path d="M12 3a6 6 0 016 6c0 4 1.5 6 2.5 7H3.5C4.5 15 6 13 6 9a6 6 0 016-6z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 3a6 6 0 016 6c0 4 1.5 6 2.5 7H3.5C4.5 15 6 13 6 9a6 6 0 016-6z" fill="currentColor" opacity="0.1"/>
    <path d="M10 20a2 2 0 004 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 方法论/书本 -->
  <symbol id="icon-book" viewBox="0 0 24 24" fill="none">
    <path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" stroke="currentColor" stroke-width="1.5"/>
    <path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2V5z" fill="currentColor" opacity="0.1"/>
    <path d="M9 7h6M9 10h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 关于/指南针 -->
  <symbol id="icon-compass" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="12,7 14,12 12,17 10,12" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- 箭头右 -->
  <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none">
    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 闪电/行动 -->
  <symbol id="icon-bolt" viewBox="0 0 24 24" fill="none">
    <path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z" fill="currentColor" opacity="0.12"/>
  </symbol>

  <!-- 分享 -->
  <symbol id="icon-share" viewBox="0 0 24 24" fill="none">
    <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <!-- 下载/报告 -->
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none">
    <path d="M12 3v12M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 更多 -->
  <symbol id="icon-more" viewBox="0 0 24 24" fill="none">
    <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
  </symbol>
</svg>
